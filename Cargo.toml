[package]
name = "egg"
version = "0.1.0"
edition = "2021"
description = "A dev environment process manager for Laravel applications"
authors = ["AlgoYounes"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/algoyounes/egg"
keywords = ["laravel", "supervisor", "cron", "process-manager", "dev-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI framework
clap = { version = "4.4", features = ["derive", "color"] }

# Config parsing
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }

# Async runtime for process management
tokio = { version = "1.34", features = ["full"] }

# Process management
nix = { version = "0.27", features = ["signal", "process"] }

# Logging & Output
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2.0"

# Cron scheduling
cron = "0.12"
chrono = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# JSON for PID file
serde_json = "1.0"

# File watching (for future hot-reload)
notify = "6.1"

# Table output for status
tabled = "0.15"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
